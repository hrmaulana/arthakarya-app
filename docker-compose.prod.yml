# ============================================================
# Arthakarya — PRODUCTION compose (self-hosted, satu server)
# ============================================================
#
# Cara pakai:
#   1. Salin .env.example.prod → .env, isi semua nilai (jalankan
#      scripts/gen-secrets.sh untuk secret acak).
#   2. Delegasikan subdomain ke Cloudflare, buat ./secrets/cloudflare.ini
#      (lihat OPS.md), lalu terbitkan sertifikat pertama:
#        docker compose -f docker-compose.prod.yml run --rm certbot
#   3. Jalankan:
#        docker compose -f docker-compose.prod.yml up -d --build
#   4. Ambil kredensial admin awal (dicetak SEKALI):
#        docker compose -f docker-compose.prod.yml logs migrator
#
# Keamanan: DB & backend TIDAK membuka port ke host — hanya bisa diakses
# lewat network Docker internal (frontend → backend → db). Host hanya
# membuka 80/443.
#
# Jaringan internal instansi yang mewajibkan proxy: isi HTTP_PROXY /
# HTTPS_PROXY di .env (server), dipakai untuk build image (npm/bun) dan
# service certbot. Kosongkan jika akses internet langsung tersedia.

x-proxy-env: &proxy-env
  http_proxy: ${HTTP_PROXY:-}
  https_proxy: ${HTTPS_PROXY:-}
  no_proxy: ${NO_PROXY:-localhost,127.0.0.1,arthakarya_db}

services:
  arthakarya_db:
    image: postgres:16-alpine
    container_name: arthakarya_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    # NOTE: tidak ada ports — internal network Docker saja

  # One-shot: migrasi skema + seed admin awal (password dicetak sekali).
  arthakarya_migrator:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        http_proxy: ${HTTP_PROXY:-}
        https_proxy: ${HTTPS_PROXY:-}
    container_name: arthakarya_migrator
    restart: "no"
    environment:
      <<: *proxy-env
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@arthakarya_db:5432/${POSTGRES_DB}
      MIGRATIONS_DIR: /app/db/migrations
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
    volumes:
      - ./db/migrations:/app/db/migrations:ro
    command: sh -c "bun run scripts/migrate.ts && bun run scripts/seed-admin.ts"
    depends_on:
      arthakarya_db:
        condition: service_healthy

  arthakarya_backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        http_proxy: ${HTTP_PROXY:-}
        https_proxy: ${HTTPS_PROXY:-}
    container_name: arthakarya_backend
    restart: unless-stopped
    environment:
      <<: *proxy-env
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@arthakarya_db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN}
      PORT: "3001"
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      arthakarya_migrator:
        condition: service_completed_successfully
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    # NOTE: tidak ada ports — diakses via nginx (docker network)

  arthakarya_frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        http_proxy: ${HTTP_PROXY:-}
        https_proxy: ${HTTPS_PROXY:-}
    container_name: arthakarya_frontend
    restart: unless-stopped
    environment:
      <<: *proxy-env
      SERVER_NAME: ${SERVER_NAME}
    volumes:
      - ./frontend/nginx.prod.conf.template:/etc/nginx/templates/default.conf.template:ro
      - letsencrypt:/etc/letsencrypt:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      arthakarya_backend:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # One-shot: terbitkan/perbarui sertifikat Let's Encrypt (DNS-01 Cloudflare).
  #   docker compose -f docker-compose.prod.yml run --rm certbot
  # Renewal: cron di host menjalankan `certbot renew` dengan image yang sama.
  certbot:
    # Image khusus dengan plugin dns-cloudflare (tidak ada di certbot/certbot)
    image: certbot/dns-cloudflare:latest
    container_name: arthakarya_certbot
    restart: "no"
    environment:
      <<: *proxy-env
      SERVER_NAME: ${SERVER_NAME}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
    volumes:
      - letsencrypt:/etc/letsencrypt
      - ./secrets/cloudflare.ini:/etc/letsencrypt/cloudflare.ini:ro
    entrypoint: sh -c 'certbot certonly -a dns-cloudflare --dns-cloudflare-credentials /etc/letsencrypt/cloudflare.ini --non-interactive --agree-tos --email "$$LETSENCRYPT_EMAIL" -d "$$SERVER_NAME"'

volumes:
  pgdata:
    name: arthakarya_pgdata_prod
  letsencrypt:
    name: arthakarya_letsencrypt
