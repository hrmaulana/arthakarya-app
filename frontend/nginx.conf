server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Batas ukuran body upload — backend multer menerima hingga 10MB per file;
    # default nginx 1MB menolak PDF scan >1MB dengan 413 (upload "gagal" di UI).
    client_max_body_size 12m;

    # SSE live-refresh (halaman RPD) — buffering harus mati supaya event
    # terkirim instan; ping 25s dari backend menjaga koneksi tetap hidup.
    location /api/rekap/events {
        proxy_pass http://arthakarya_backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # API proxy to backend
    location /api/ {
        proxy_pass http://arthakarya_backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
