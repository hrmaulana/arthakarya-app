services:
  arthakarya_db:
    image: postgres:16-alpine
    container_name: arthakarya_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arthakarya"]
      interval: 5s
      timeout: 5s
      retries: 5

  arthakarya_backend:
    build:
      context: ./backend
      args:
        HTTP_PROXY: ${HTTP_PROXY}
        HTTPS_PROXY: ${HTTPS_PROXY}
        NO_PROXY: ${NO_PROXY}
      dockerfile: Dockerfile
    container_name: arthakarya_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      PORT: ${PORT}
      NODE_ENV: ${NODE_ENV}
    ports:
      - "3001:3001"
    depends_on:
      arthakarya_db:
        condition: service_healthy

  arthakarya_frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY}
        HTTPS_PROXY: ${HTTPS_PROXY}
        NO_PROXY: ${NO_PROXY}
    container_name: arthakarya_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - arthakarya_backend

  arthakarya_cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: arthakarya_cloudflared
    restart: unless-stopped
    command:
      - tunnel
      - --protocol
      - http2
      - run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
      HTTP_PROXY: ${HTTP_PROXY}
      HTTPS_PROXY: ${HTTPS_PROXY}
      NO_PROXY: ${NO_PROXY}
    depends_on:
      - arthakarya_frontend

volumes:
  pgdata:
    name: arthakarya_pgdata
